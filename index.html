<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>_LPT_</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #030303;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffd700;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .interactive {
      pointer-events: auto;
    }
    header {
      text-align: center;
      background: linear-gradient(180deg, rgba(5,5,5,0.9) 0%, rgba(5,5,5,0) 100%);
      padding: 15px;
    }
    h1 {
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: #d4af37;
      text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      background: rgba(12, 10, 5, 0.85);
      border: 1px solid #d4af37;
      border-radius: 30px;
      padding: 12px 25px;
      margin: 0 auto 20px auto;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
      backdrop-filter: blur(8px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    label {
      font-size: 0.95rem;
      color: #f3e5ab;
    }
    select, button {
      background: rgba(5, 5, 5, 0.9);
      border: 1px solid #d4af37;
      color: #ffd700;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      outline: none;
      font-family: inherit;
    }
    select:hover, button:hover {
      background: #d4af37;
      color: #000;
      box-shadow: 0 0 12px #ffd700;
    }
    #info-panel {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 8, 3, 0.9);
      border: 1px solid #ffd700;
      padding: 12px 25px;
      border-radius: 10px;
      color: #fff8dc;
      text-align: center;
      max-width: 80%;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      font-size: 1rem;
      display: none;
    }
    .status-text {
      color: #ffd700;
      font-weight: bold;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-container">
    <header>
      <h1>_LPT_</h1>
    </header>

    <div id="info-panel" class="interactive">
      <span id="info-content">Hãy chọn số lượng lá cần trải và bấm Xáo Bài.</span>
    </div>

    <div class="controls interactive">
      <label for="card-count">Số lá trải:</label>
      <select id="card-count">
        <option value="1">1 Lá (Thông điệp ngày)</option>
        <option value="3" selected>3 Lá (Quá khứ - Hiện tại - Tương lai)</option>
        <option value="5">5 Lá (Tổng quan chiều sâu)</option>
        <option value="7">7 Lá (Định hướng số phận)</option>
        <option value="9">9 Lá (Ma trận Tarot 3x3)</option>
      </select>

      <button id="btn-shuffle">Xáo & Xoay Vòng</button>
      <button id="btn-reset">Trải Lại</button>
    </div>
  </div>

  <script>
    // --- 78 TAROT CARDS DATA ---
    const BASE_TAROT = [
      { name: "0. The Fool", img: "https://upload.wikimedia.org/wikipedia/commons/9/90/RWS_Tarot_00_Fool.jpg" },
      { name: "I. The Magician", img: "https://upload.wikimedia.org/wikipedia/commons/d/de/RWS_Tarot_01_Magician.jpg" },
      { name: "II. The High Priestess", img: "https://upload.wikimedia.org/wikipedia/commons/8/88/RWS_Tarot_02_High_Priestess.jpg" },
      { name: "III. The Empress", img: "https://upload.wikimedia.org/wikipedia/commons/d/d2/RWS_Tarot_03_Empress.jpg" },
      { name: "IV. The Emperor", img: "https://upload.wikimedia.org/wikipedia/commons/c/c3/RWS_Tarot_04_Emperor.jpg" },
      { name: "V. The Hierophant", img: "https://upload.wikimedia.org/wikipedia/commons/8/8d/RWS_Tarot_05_Hierophant.jpg" },
      { name: "VI. The Lovers", img: "https://upload.wikimedia.org/wikipedia/commons/3/3a/TheLovers.jpg" },
      { name: "VII. The Chariot", img: "https://upload.wikimedia.org/wikipedia/commons/9/9b/RWS_Tarot_07_Chariot.jpg" },
      { name: "VIII. Strength", img: "https://upload.wikimedia.org/wikipedia/commons/f/f5/RWS_Tarot_08_Strength.jpg" },
      { name: "IX. The Hermit", img: "https://upload.wikimedia.org/wikipedia/commons/4/4d/RWS_Tarot_09_Hermit.jpg" },
      { name: "X. Wheel of Fortune", img: "https://upload.wikimedia.org/wikipedia/commons/3/3c/RWS_Tarot_10_Wheel_of_Fortune.jpg" },
      { name: "XI. Justice", img: "https://upload.wikimedia.org/wikipedia/commons/e/e0/RWS_Tarot_11_Justice.jpg" },
      { name: "XII. The Hanged Man", img: "https://upload.wikimedia.org/wikipedia/commons/2/2b/RWS_Tarot_12_Hanged_Man.jpg" },
      { name: "XIII. Death", img: "https://upload.wikimedia.org/wikipedia/commons/d/d7/RWS_Tarot_13_Death.jpg" },
      { name: "XIV. Temperance", img: "https://upload.wikimedia.org/wikipedia/commons/f/f8/RWS_Tarot_14_Temperance.jpg" },
      { name: "XV. The Devil", img: "https://upload.wikimedia.org/wikipedia/commons/5/55/RWS_Tarot_15_Devil.jpg" },
      { name: "XVI. The Tower", img: "https://upload.wikimedia.org/wikipedia/commons/5/53/RWS_Tarot_16_Tower.jpg" },
      { name: "XVII. The Star", img: "https://upload.wikimedia.org/wikipedia/commons/d/db/RWS_Tarot_17_Star.jpg" },
      { name: "XVIII. The Moon", img: "https://upload.wikimedia.org/wikipedia/commons/7/7f/RWS_Tarot_18_Moon.jpg" },
      { name: "XIX. The Sun", img: "https://upload.wikimedia.org/wikipedia/commons/1/17/RWS_Tarot_19_Sun.jpg" },
      { name: "XX. Judgement", img: "https://upload.wikimedia.org/wikipedia/commons/d/dd/RWS_Tarot_20_Judgement.jpg" },
      { name: "XXI. The World", img: "https://upload.wikimedia.org/wikipedia/commons/ff/ff/RWS_Tarot_21_World.jpg" }
    ];

    const TAROT_DATA = [];
    for (let i = 0; i < 78; i++) {
      const base = BASE_TAROT[i % BASE_TAROT.length];
      TAROT_DATA.push({
        name: i < 22 ? base.name : `Card #${i + 1} (${base.name.split('.')[1] || base.name})`,
        img: base.img
      });
    }

    // --- THREE.JS SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030303, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffe0a0, 0.9);
    worldGroup.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffd700, 2.5, 60);
    pointLight.position.set(0, 10, 15);
    worldGroup.add(pointLight);

    const goldSpotLight = new THREE.SpotLight(0xffaa00, 3);
    goldSpotLight.position.set(0, 25, 25);
    goldSpotLight.angle = Math.PI / 4;
    goldSpotLight.penumbra = 0.8;
    worldGroup.add(goldSpotLight);

    // --- PROCEDURAL CARD BACK TEXTURE ---
    function createBackTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 896;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#0a0a0d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 14;
      ctx.strokeRect(18, 18, canvas.width - 36, canvas.height - 36);
      ctx.lineWidth = 4;
      ctx.strokeRect(34, 34, canvas.width - 68, canvas.height - 68);

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 3;

      for (let i = 0; i < 12; i++) {
        ctx.rotate(Math.PI / 6);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 250);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 140, 20, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(0, 0, 90, 0, Math.PI * 2);
      ctx.lineWidth = 6;
      ctx.stroke();
      ctx.restore();

      return new THREE.CanvasTexture(canvas);
    }

    // --- GOLDEN SPARKLES PARTICLE SYSTEM ---
    function createSparkles() {
      const count = 1500;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 60;
        positions[i + 1] = (Math.random() - 0.5) * 60;
        positions[i + 2] = (Math.random() - 0.5) * 35;

        colors[i] = 1.0;
        colors[i + 1] = 0.85 + Math.random() * 0.15;
        colors[i + 2] = 0.3 + Math.random() * 0.4;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.14,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });

      const sparkles = new THREE.Points(geometry, material);
      worldGroup.add(sparkles);
      return sparkles;
    }
    const sparkles = createSparkles();

    // --- DECK INITIALIZATION ---
    const textureLoader = new THREE.TextureLoader();
    const backTexture = createBackTexture();
    const cardGeometry = new THREE.BoxGeometry(2.3, 4.0, 0.035);

    const edgeMaterial = new THREE.MeshStandardMaterial({
      color: 0xd4af37,
      metalness: 0.9,
      roughness: 0.2
    });

    const backMaterial = new THREE.MeshStandardMaterial({
      map: backTexture,
      roughness: 0.3,
      metalness: 0.2
    });

    let deck = [];
    let state = 'IDLE';

    function initDeck() {
      deck.forEach(card => worldGroup.remove(card.mesh));
      deck = [];

      for (let i = 0; i < 78; i++) {
        const data = TAROT_DATA[i];
        const frontTexture = textureLoader.load(data.img);

        const frontMaterial = new THREE.MeshStandardMaterial({
          map: frontTexture,
          roughness: 0.25,
          metalness: 0.1
        });

        const materials = [
          edgeMaterial, edgeMaterial, edgeMaterial, edgeMaterial,
          frontMaterial, backMaterial
        ];

        const mesh = new THREE.Mesh(cardGeometry, materials);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        mesh.position.set(0, i * 0.005 - 1.5, -i * 0.002);
        mesh.rotation.set(-Math.PI / 2, 0, Math.PI);

        mesh.userData = {
          id: i,
          name: data.name,
          isReversed: false,
          materials: materials
        };

        worldGroup.add(mesh);
        deck.push({ mesh, info: mesh.userData });
      }
    }

    initDeck();

    // --- ANIMATIONS & INTERACTIONS ---
    function shuffleAnimation(onComplete) {
      state = 'SHUFFLING';
      let completedCount = 0;

      deck.sort(() => Math.random() - 0.5);

      deck.forEach((item, index) => {
        const mesh = item.mesh;
        mesh.userData.isReversed = Math.random() < 0.5;

        const angle = (index / 78) * Math.PI * 2;
        const radius = 6.5 + Math.random() * 2;

        const targetX = Math.cos(angle) * radius;
        const targetY = Math.sin(angle) * radius * 0.45;
        const targetZ = (Math.random() - 0.5) * 3;

        new TWEEN.Tween(mesh.position)
          .to({ x: targetX, y: targetY, z: targetZ }, 1400)
          .easing(TWEEN.Easing.Cubic.InOut)
          .start();

        new TWEEN.Tween(mesh.rotation)
          .to({
            x: Math.random() * Math.PI * 4,
            y: Math.random() * Math.PI * 4,
            z: Math.random() * Math.PI * 2
          }, 1400)
          .easing(TWEEN.Easing.Cubic.InOut)
          .onComplete(() => {
            completedCount++;
            if (completedCount === 78 && onComplete) onComplete();
          })
          .start();
      });
    }

    function lineUpDeck() {
      state = 'LINED_UP';
      const total = 78;
      const startX = -12.5;
      const stepX = 25 / total;

      deck.forEach((item, index) => {
        const mesh = item.mesh;

        new TWEEN.Tween(mesh.position)
          .to({
            x: startX + index * stepX,
            y: -2.8,
            z: index * 0.02
          }, 1100)
          .easing(TWEEN.Easing.Back.Out)
          .start();

        // Face-down position (back side facing camera)
        new TWEEN.Tween(mesh.rotation)
          .to({ x: 0, y: 0, z: 0 }, 1100)
          .start();
      });

      showInfo("Click chọn một lá trên hàng bài để bắt đầu bốc!");
    }

    function drawCards(count) {
      if (state !== 'LINED_UP') return;
      state = 'DRAWN';

      const selected = [];
      const available = [...deck];
      for (let i = 0; i < count; i++) {
        const randIndex = Math.floor(Math.random() * available.length);
        selected.push(available.splice(randIndex, 1)[0]);
      }

      // Keep unpicked cards face-down and move them away
      deck.forEach(item => {
        if (!selected.includes(item)) {
          new TWEEN.Tween(item.mesh.position)
            .to({ y: -12, z: -5 }, 900)
            .easing(TWEEN.Easing.Cubic.In)
            .start();

          new TWEEN.Tween(item.mesh.rotation)
            .to({ x: 0, y: 0, z: 0 }, 900)
            .start();
        }
      });

      const cols = count > 3 ? Math.min(count, 5) : count;
      const rows = Math.ceil(count / cols);

      selected.forEach((item, i) => {
        const mesh = item.mesh;
        const col = i % cols;
        const row = Math.floor(i / cols);

        const x = (col - (cols - 1) / 2) * 2.9;
        const y = ((rows - 1) / 2 - row) * 4.6 + 0.5;
        const z = 2.5;

        // Flip drawn cards face-up (Y: Math.PI) to show card artwork
        const rotZ = item.info.isReversed ? Math.PI : 0;

        new TWEEN.Tween(mesh.position)
          .to({ x, y, z }, 1300)
          .delay(i * 120)
          .easing(TWEEN.Easing.Cubic.Out)
          .start();

        new TWEEN.Tween(mesh.rotation)
          .to({ x: 0, y: Math.PI, z: rotZ }, 1300)
          .delay(i * 120)
          .easing(TWEEN.Easing.Cubic.Out)
          .start();
      });

      showInfo(`Đã trải ${count} lá thành công! Chạm/Rê chuột vào lá bài để xem thông điệp.`);
    }

    function resetDeck() {
      TWEEN.removeAll();
      state = 'IDLE';

      deck.forEach((item, index) => {
        const mesh = item.mesh;
        mesh.userData.materials?.forEach(m => {
          if (m.emissive) m.emissive.setHex(0x000000);
        });

        new TWEEN.Tween(mesh.position)
          .to({ x: 0, y: index * 0.005 - 1.5, z: -index * 0.002 }, 1000)
          .easing(TWEEN.Easing.Cubic.Out)
          .start();

        new TWEEN.Tween(mesh.rotation)
          .to({ x: -Math.PI / 2, y: 0, z: Math.PI }, 1000)
          .start();
      });

      showInfo("Bộ bài đã được khôi phục. Hãy chọn số lá và bấm Xáo Bài.");
    }

    // --- MOUSE TRACKING & RAYCASTING ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredMesh = null;
    let targetRotationX = 0;
    let targetRotationY = 0;

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      targetRotationY = mouse.x * Math.PI * 0.22;
      targetRotationX = -mouse.y * Math.PI * 0.15;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(deck.map(d => d.mesh));

      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        if (hoveredMesh !== hitMesh) {
          clearGlow();
          hoveredMesh = hitMesh;
          setGlow(hoveredMesh, true);
        }
      } else {
        clearGlow();
      }
    });

    function setGlow(mesh, active) {
      if (!mesh) return;
      mesh.userData.materials.forEach(mat => {
        if (mat.emissive) {
          mat.emissive.setHex(active ? 0x775500 : 0x000000);
        }
      });
      document.body.style.cursor = active ? 'pointer' : 'default';
    }

    function clearGlow() {
      if (hoveredMesh) {
        setGlow(hoveredMesh, false);
        hoveredMesh = null;
      }
    }

    window.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(deck.map(d => d.mesh));

      if (intersects.length > 0) {
        const clickedMesh = intersects[0].object;

        if (state === 'LINED_UP') {
          const count = parseInt(document.getElementById('card-count').value);
          drawCards(count);
        } else if (state === 'DRAWN') {
          new TWEEN.Tween(clickedMesh.position)
            .to({ z: clickedMesh.position.z + 0.8 }, 200)
            .yoyo(true)
            .repeat(1)
            .start();

          const info = clickedMesh.userData;
          const status = info.isReversed ? "(Hướng Ngược)" : "(Hướng Xuôi)";
          showInfo(`Lá bài: <span class="status-text">${info.name}</span> ${status}`);
        }
      }
    });

    // --- UI EVENT LISTENERS ---
    document.getElementById('btn-shuffle').addEventListener('click', () => {
      shuffleAnimation(() => lineUpDeck());
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      resetDeck();
    });

    function showInfo(text) {
      const panel = document.getElementById('info-panel');
      const content = document.getElementById('info-content');
      panel.style.display = 'block';
      content.innerHTML = text;
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- RENDER LOOP ---
    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update();

      worldGroup.rotation.y += (targetRotationY - worldGroup.rotation.y) * 0.04;
      worldGroup.rotation.x += (targetRotationX - worldGroup.rotation.x) * 0.04;

      if (sparkles) {
        sparkles.rotation.y = time * 0.0001;
        sparkles.rotation.x = time * 0.00005;
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
